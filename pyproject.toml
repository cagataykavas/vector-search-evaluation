[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-search-evaluation"
version = "0.2.0"
description = "Dense, BM25 and hybrid retrieval engine with ranking evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["evaluate"]
packages = ["search", "app"]

[tool.ruff]
line-length = 100
